<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FruiterMan Fit - Main Dashboard</title>
<!-- BEGIN: External Scripts -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#00D4FF',
              lime: '#CCFF00',
              dark: '#0A0A0B',
              surface: '#1A1A1E'
            }
          },
          borderRadius: {
            'xl-organic': '2.5rem',
            '2xl-organic': '4rem',
          }
        }
      }
    }
  </script>
<!-- END: External Scripts -->
<!-- BEGIN: Global Styles -->
<style data-purpose="global-typography">
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0A0A0B;
      color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
    }
    .stitch-border {
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 2rem;
    }
  </style>
<style data-purpose="custom-shapes">
    .organic-blob {
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    }
    .vibrant-glow-blue {
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }
    .vibrant-glow-lime {
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.4);
    }
  </style>
<!-- END: Global Styles -->
</head>
<body class="flex flex-col min-h-screen">
<!-- BEGIN: MainHeader -->
<header class="p-6 pt-12 flex justify-between items-center" data-purpose="app-header">
<div class="flex flex-col">
<h1 class="text-3xl font-black italic tracking-tighter text-brand-blue leading-none">FRUITERMAN</h1>
<p class="text-sm font-bold text-white/60 tracking-widest uppercase">Fit Dashboard</p>
</div>
<!-- Profile Avatar with Organic Shape -->
<div class="w-12 h-12 organic-blob bg-brand-lime p-0.5" data-purpose="user-avatar-container">
<div class="w-full h-full organic-blob overflow-hidden bg-brand-dark flex items-center justify-center">
<span class="text-brand-lime font-black">FM</span>
</div>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-6 pb-24 overflow-y-auto" data-purpose="dashboard-content">
<!-- BEGIN: QuickStats -->
<section class="grid grid-cols-2 gap-4 mb-8" data-purpose="quick-stats-section">
<!-- Week Progress -->
<div class="bg-brand-surface p-5 rounded-[2rem] flex flex-col justify-between h-32 relative overflow-hidden" data-purpose="stat-card">
<div class="z-10">
<p class="text-xs font-bold text-white/50 uppercase tracking-wider">This Week</p>
<p class="text-2xl font-black text-brand-blue">4/5</p>
</div>
<div class="z-10 text-xs font-medium text-white/80">Workouts Done</div>
<!-- Decorative Circle -->
<div class="absolute -right-4 -bottom-4 w-16 h-16 bg-brand-blue/10 rounded-full"></div>
</div>
<!-- Streak -->
<div class="bg-brand-lime p-5 rounded-[2rem] flex flex-col justify-between h-32 relative overflow-hidden vibrant-glow-lime" data-purpose="stat-card">
<div class="z-10">
<p class="text-xs font-bold text-black/50 uppercase tracking-wider">Streak</p>
<p class="text-2xl font-black text-brand-dark">12 DAYS</p>
</div>
<div class="z-10">
<svg class="h-6 w-6 text-brand-dark" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Decorative Circle -->
<div class="absolute -left-4 -top-4 w-20 h-20 bg-white/20 rounded-full"></div>
</div>
</section>
<!-- END: QuickStats -->
<!-- BEGIN: WorkoutsSection -->
<section class="mb-8" data-purpose="workout-section">
<div class="flex justify-between items-end mb-4">
<h2 class="text-2xl font-black uppercase tracking-tight italic">Today's Workout</h2>
<span class="text-brand-blue text-xs font-black uppercase mb-1">See All</span>
</div>
<!-- Main Workout Card with Stitch Effect -->
<div class="bg-brand-surface p-1 rounded-[2.2rem]" data-purpose="featured-workout-card">
<div class="stitch-border p-6 bg-brand-surface h-64 flex flex-col justify-between relative overflow-hidden">
<div class="z-10">
<h3 class="text-4xl font-black leading-none mb-2 text-white">CITRUS<br/>SHRED</h3>
<div class="flex gap-2">
<span class="bg-white/10 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase">45 Mins</span>
<span class="bg-brand-blue/20 text-brand-blue text-[10px] font-bold px-3 py-1 rounded-full uppercase">Advanced</span>
</div>
</div>
<!-- Action Button -->
<button class="z-10 w-full bg-brand-blue text-brand-dark font-black py-4 rounded-2xl uppercase tracking-tighter hover:scale-95 transition-transform" data-purpose="start-workout-button">
            Launch Session
          </button>
<!-- Organic Background Shape -->
<div class="absolute -right-10 top-0 w-48 h-48 bg-brand-blue/20 organic-blob rotate-12 -z-0"></div>
</div>
</div>
</section>
<!-- END: WorkoutsSection -->
<!-- BEGIN: NextUp -->
<section data-purpose="upcoming-activities">
<h2 class="text-xl font-black uppercase tracking-tight mb-4 italic">Next Up</h2>
<div class="space-y-4">
<!-- Activity Item 1 -->
<div class="flex items-center gap-4 bg-white/5 p-4 rounded-[2rem]" data-purpose="activity-item">
<div class="w-12 h-12 rounded-2xl bg-brand-blue/20 flex items-center justify-center text-brand-blue">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div class="flex-1">
<p class="font-black text-sm uppercase">Morning Mobility</p>
<p class="text-xs text-white/40">Starts in 2 hours</p>
</div>
<button class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- Activity Item 2 -->
<div class="flex items-center gap-4 bg-white/5 p-4 rounded-[2rem]" data-purpose="activity-item">
<div class="w-12 h-12 rounded-2xl bg-brand-lime/20 flex items-center justify-center text-brand-lime">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div class="flex-1">
<p class="font-black text-sm uppercase">Nutrition Log</p>
<p class="text-xs text-white/40">Update required</p>
</div>
<button class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
</section>
<!-- END: NextUp -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNav -->
<nav class="fixed bottom-0 left-0 right-0 bg-brand-dark/80 backdrop-blur-xl border-t border-white/5 px-8 py-4 flex justify-between items-center z-50" data-purpose="navigation-bar">
<!-- Home -->
<a class="text-brand-blue flex flex-col items-center" href="#">
<svg class="h-6 w-6 mb-1" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"></path>
</svg>
<span class="text-[10px] font-black uppercase">Home</span>
</a>
<!-- Training -->
<a class="text-white/40 flex flex-col items-center" href="#">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-black uppercase">Plans</span>
</a>
<!-- Center Play (Float) -->
<div class="relative -top-8">
<div class="w-16 h-16 bg-brand-lime rounded-full flex items-center justify-center vibrant-glow-lime shadow-2xl">
<svg class="h-8 w-8 text-brand-dark ml-1" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8 5v14l11-7z"></path>
</svg>
</div>
</div>
<!-- Social -->
<a class="text-white/40 flex flex-col items-center" href="#">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-black uppercase">Social</span>
</a>
<!-- Settings -->
<a class="text-white/40 flex flex-col items-center" href="#">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-black uppercase">More</span>
</a>
</nav>
<!-- END: BottomNav -->
</body></html>
