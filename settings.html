<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile Settings - FruiterMan Fit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d1fa45", // Vibrant Lime Green
                        "accent-blue": "#1e40af", // Electric Blue
                        "background-light": "#f8f6f6",
                        "background-dark": "#0a0a2e", // Deep blue-black for contrast
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .stitch-border {
            border: 2px dashed rgba(209, 250, 69, 0.4);
        }
        .organic-shape-1 {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen pb-12">
<!-- Header -->
<header class="flex items-center px-6 py-8 justify-between">
<button class="flex items-center justify-center size-12 bg-white/10 dark:bg-white/5 rounded-2xl backdrop-blur-md">
<span class="material-symbols-outlined text-primary">arrow_back_ios_new</span>
</button>
<h1 class="text-2xl font-800 tracking-tight text-slate-900 dark:text-white">Settings</h1>
<div class="size-12"></div> <!-- Spacer for symmetry -->
</header>
<main class="px-4 space-y-6">
<!-- Main Organic Card -->
<div class="bg-white dark:bg-slate-900/50 rounded-2xl p-6 stitch-border shadow-xl">
<!-- Profile Section -->
<div class="flex flex-col items-center mb-8">
<div class="relative">
<div class="size-32 rounded-full border-4 border-primary p-1">
<div class="size-full rounded-full bg-slate-200 dark:bg-slate-800 bg-cover bg-center overflow-hidden" data-alt="User profile avatar with a friendly character" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAFa6KuXjpcUTAY8un62-F5keKj50rkhLeN_ym0xJnJPOcv9QA_Bcf9nCeRVQQDM4xTHAEeaoefz8Ku5rnN_idOyLh444g9E7JCmkVxvxGFidnNet4bB5l0p5sjMFdYc1AHc2q4fS6cgde-CDYK47MnIP1Qh1bDzHjNCxcwdPLdooptEl00dy95gZGZxThnNXUgaL19Qgo-WJ-yLPAuRHVT76o53MII5OaI0eGtPPsOLn5UZBRIiXIdiJ0kmeDIJlLxxK-aTuxzw6o');">
</div>
</div>
<button class="absolute bottom-0 right-0 size-10 bg-primary text-background-dark rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[20px] font-bold">edit</span>
</button>
</div>
<p class="mt-4 text-xl font-bold">Fruit Master John</p>
<p class="text-slate-500 dark:text-slate-400 text-sm">Member since May 2024</p>
</div>
<!-- User Info Fields -->
<div class="space-y-4">
<div>
<label class="block text-sm font-bold mb-2 ml-1 text-primary">Full Name</label>
<input class="w-full bg-slate-100 dark:bg-slate-800 border-0 rounded-2xl h-14 px-5 focus:ring-2 focus:ring-primary text-slate-900 dark:text-white" type="text" value="John Appleseed"/>
</div>
<div>
<label class="block text-sm font-bold mb-2 ml-1 text-primary">Bio</label>
<textarea class="w-full bg-slate-100 dark:bg-slate-800 border-0 rounded-2xl h-24 px-5 py-4 focus:ring-2 focus:ring-primary text-slate-900 dark:text-white resize-none" placeholder="Fueling my workouts with nature's candy! 🍎🍓"></textarea>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-bold mb-2 ml-1 text-primary">Weight (kg)</label>
<input class="w-full bg-slate-100 dark:bg-slate-800 border-0 rounded-2xl h-14 px-5 focus:ring-2 focus:ring-primary text-slate-900 dark:text-white" type="number" value="78"/>
</div>
<div>
<label class="block text-sm font-bold mb-2 ml-1 text-primary">Height (cm)</label>
<input class="w-full bg-slate-100 dark:bg-slate-800 border-0 rounded-2xl h-14 px-5 focus:ring-2 focus:ring-primary text-slate-900 dark:text-white" type="number" value="182"/>
</div>
</div>
</div>
<!-- Toggles Section -->
<div class="mt-8 space-y-4 pt-6 border-t border-slate-200 dark:border-slate-800">
<div class="flex items-center justify-between p-2">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">notifications</span>
<span class="font-bold">Notifications</span>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-12 h-6 bg-slate-300 dark:bg-slate-700 rounded-full peer peer-checked:bg-primary transition-colors"></div>
<div class="absolute left-1 top-1 bg-white size-4 rounded-full peer-checked:translate-x-6 transition-transform"></div>
</div>
</div>
<div class="flex items-center justify-between p-2">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">dark_mode</span>
<span class="font-bold">Dark Mode</span>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-12 h-6 bg-slate-300 dark:bg-slate-700 rounded-full peer peer-checked:bg-primary transition-colors"></div>
<div class="absolute left-1 top-1 bg-white size-4 rounded-full peer-checked:translate-x-6 transition-transform"></div>
</div>
</div>
<div class="flex items-center justify-between p-2">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">settings_accessibility</span>
<span class="font-bold">Unit System</span>
</div>
<div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
<button class="px-4 py-1.5 rounded-lg bg-primary text-background-dark font-bold text-xs">Metric</button>
<button class="px-4 py-1.5 rounded-lg font-bold text-xs text-slate-500">Imperial</button>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-4 space-y-4">
<button class="w-full h-16 bg-primary text-background-dark rounded-2xl flex items-center justify-center gap-3 font-800 text-lg shadow-[0_8px_20px_rgba(209,250,69,0.3)]">
<span class="material-symbols-outlined font-bold">nutrition</span>
                Save Changes
            </button>
<div class="grid grid-cols-2 gap-4">
<button class="h-14 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl flex items-center justify-center gap-2 font-bold text-sm">
<span class="material-symbols-outlined text-slate-500">help</span>
                    Help
                </button>
<button class="h-14 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl flex items-center justify-center gap-2 font-bold text-sm">
<span class="material-symbols-outlined text-slate-500">gavel</span>
                    Terms
                </button>
</div>
<button class="w-full h-14 bg-red-500/10 text-red-500 rounded-2xl flex items-center justify-center gap-2 font-bold transition-all hover:bg-red-500/20">
<span class="material-symbols-outlined">logout</span>
                Log Out
            </button>
</div>
<!-- Decorative Organic Shape in Footer -->
<div class="flex justify-center pt-8 pb-4 opacity-20">
<div class="size-20 bg-primary organic-shape-1"></div>
</div>
</main>
</body></html>
