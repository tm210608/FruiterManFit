<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13", // Theme Primary
                        "accent-lime": "#d9f99d", // Lime Green for Fruit theme
                        "electric-blue": "#3b82f6", // Electric Blue background
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem", // More rounded for juvenile style
                        "2xl": "2.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .stitching {
            border: 2px dashed rgba(255, 255, 255, 0.3);
        }
        .card-stitching {
            border: 2px dashed #ec5b13;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-electric-blue dark:bg-background-dark min-h-screen flex flex-col items-center justify-center p-4">
<!-- Main Container -->
<div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden relative">
<!-- Header Section with Brand -->
<div class="bg-primary p-8 flex flex-col items-center text-center gap-4 rounded-b-2xl relative overflow-hidden">
<!-- Decorative Pattern -->
<div class="absolute inset-0 opacity-10 pointer-events-none">
<div class="absolute top-0 left-0 w-24 h-24 rounded-full border-4 border-white -translate-x-1/2 -translate-y-1/2"></div>
<div class="absolute bottom-0 right-0 w-32 h-32 rounded-full border-4 border-white translate-x-1/3 translate-y-1/3"></div>
</div>
<!-- Logo: Stylized Fruit/Man Hybrid -->
<div class="w-24 h-24 bg-accent-lime rounded-full flex items-center justify-center shadow-lg border-4 border-white">
<span class="material-symbols-outlined text-primary text-6xl" style="font-variation-settings: 'FILL' 1">nutrition</span>
</div>
<div class="z-10">
<h1 class="text-white text-4xl font-extrabold tracking-tight leading-tight italic">FruiterMan Fit</h1>
<p class="text-white/80 font-medium">Get Juicy. Get Fit.</p>
</div>
</div>
<!-- Login Card Content -->
<div class="p-8 pt-10 relative">
<!-- Decorative Stitching Effect -->
<div class="absolute inset-4 pointer-events-none card-stitching rounded-xl opacity-20"></div>
<div class="relative z-10">
<h2 class="text-slate-900 dark:text-slate-100 text-3xl font-bold mb-8">Welcome back</h2>
<form class="space-y-6">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-bold uppercase tracking-wider px-1">Email Address</label>
<div class="relative">
<input class="w-full h-14 bg-slate-50 dark:bg-slate-800 border-2 border-primary/20 focus:border-primary focus:ring-0 rounded-xl px-4 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 font-medium transition-all" placeholder="fruity@man.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-bold uppercase tracking-wider px-1">Password</label>
<div class="relative flex items-stretch">
<input class="w-full h-14 bg-slate-50 dark:bg-slate-800 border-2 border-primary/20 border-r-0 focus:border-primary focus:ring-0 rounded-l-xl px-4 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 font-medium transition-all" placeholder="••••••••" type="password"/>
<div class="flex items-center justify-center px-4 bg-slate-50 dark:bg-slate-800 border-2 border-primary/20 border-l-0 rounded-r-xl text-slate-400">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</div>
<!-- Login Button -->
<button class="w-full h-16 bg-accent-lime hover:bg-lime-300 text-slate-900 font-extrabold text-xl rounded-xl shadow-lg shadow-lime-500/20 transition-transform active:scale-95 flex items-center justify-center gap-2" type="submit">
<span>GO!</span>
<span class="material-symbols-outlined font-bold">bolt</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-8">
<div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
<span class="px-4 text-slate-400 text-xs font-bold uppercase tracking-widest">or jump in with</span>
<div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-4 mb-8">
<button class="flex-1 h-14 flex items-center justify-center rounded-xl bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
<img class="w-6 h-6 mr-2" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAujbB1M7TI48T80ZZECst81VOjBS6YcQp9Cfuuf1fsF7WwXId-FSJANdmjDJSKJ5wbRrIOHRWqZPspAoG7j1sSM_enTBEzPBjd6QKUuSLKcftTH4btFQkpSUPKp4kOq63F919-w0bB1tfmbB-P_qG3ME_MpmLDJ4F64h_qICJ-_CpwkcNy-jTKsHRQvDNo7287o5M_5YE_VFyXACxiygFhZN2RcnJ74RH86vcZuJKwOJD_iKH_F6xI9gcu1MLOadP43WUwm4CX0yI"/>
<span class="text-slate-700 dark:text-slate-300 font-bold text-sm">Google</span>
</button>
<button class="flex-1 h-14 flex items-center justify-center rounded-xl bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
<img class="w-6 h-6 mr-2" data-alt="Apple logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjVoTn8Bz1Q7L7JqZLX4511XslCsL5zo9PPTVqkuZSfey69zSr1WPMNG8nwH0v0emmdGOfXk1RFmQrNdn_HX2Z7Djha21ZjzPGCKnJ0HHn7lgGntA1DklTdmfMYIa7Xbb3BdxijNSJjCUtRXZZrG-6wyqvY6ogKht8TxDK-Rax0MU4DHk_ywcay21s5MluIsubVQhG2nLgO8oU67ixNVX6lnaVNLuzWXbT5sq3iwjA_Cl_0k5BOzS7mfPetf4EeKzCLisU7daGynM"/>
<span class="text-slate-700 dark:text-slate-300 font-bold text-sm">Apple</span>
</button>
</div>
<!-- Signup Link -->
<div class="text-center">
<p class="text-slate-500 dark:text-slate-400 font-medium">
                        New fruit on the tree? 
                        <a class="text-primary font-extrabold hover:underline ml-1" href="#">Sign up</a>
</p>
</div>
</div>
</div>
</div>
<!-- Decorative Bottom Elements -->
<div class="mt-8 flex gap-4 opacity-50">
<div class="w-3 h-3 rounded-full bg-accent-lime"></div>
<div class="w-3 h-3 rounded-full bg-white"></div>
<div class="w-3 h-3 rounded-full bg-accent-lime"></div>
</div>
</body></html>
